<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>安心提醒</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background-color: #f8fafc; color: #1e293b; height: 100vh; overflow-y: auto; }
        .main-content { padding: 24px; display: none; }
        .main-title { font-size: 28px; margin-bottom: 20px; color: #2563eb; text-align: center; font-weight: bold; }
        
        .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card h2 { font-size: 22px; margin-bottom: 10px; color: #1e293b;}
        .card p { font-size: 18px; color: #475569; line-height: 1.5; }
        
        /* 表单样式 */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 18px; margin-bottom: 5px; color: #333; }
        .form-group input { width: 100%; padding: 12px; font-size: 18px; border: 1px solid #cbd5e1; border-radius: 8px; }
        .btn-save { width: 100%; padding: 15px; font-size: 20px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 10px; }

        /* 药品列表样式 */
        .med-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; }
        .med-item:last-child { border-bottom: none; }
        .med-info h3 { font-size: 20px; color: #333; margin-bottom: 5px; }
        .med-info p { font-size: 16px; color: #666; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 16px; }

        /* 引导层样式 */
        #guide-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff; z-index: 9999; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; text-align: center; transition: opacity 0.5s;
        }
        .guide-icon { font-size: 70px; margin-bottom: 20px; }
        .guide-title { font-size: 28px; font-weight: bold; margin-bottom: 15px; color: #333; }
        .guide-desc { font-size: 20px; color: #555; line-height: 1.6; margin-bottom: 40px; }
        .guide-btn { background: #2563eb; color: white; border: none; padding: 15px 40px; font-size: 22px; border-radius: 50px; width: 100%; max-width: 280px; font-weight: bold; box-shadow: 0 4px 10px rgba(37,99,235,0.3); }
        .guide-dots { display: flex; gap: 10px; margin-bottom: 30px; }
        .guide-dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; }
        .guide-dot.active { background: #2563eb; width: 20px; border-radius: 5px; }

        /* 八段锦弹窗样式 */
        #baduanjin-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 10000; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; text-align: center;
        }
        .bdj-title { font-size: 32px; color: #10b981; margin-bottom: 20px; font-weight: bold; }
        .bdj-icon { font-size: 100px; margin-bottom: 30px; }
        .bdj-desc { font-size: 22px; color: #333; line-height: 1.6; margin-bottom: 40px; }
        .bdj-btn { background: #10b981; color: white; border: none; padding: 18px; font-size: 24px; border-radius: 50px; width: 100%; max-width: 300px; font-weight: bold; }
        .bdj-close { margin-top: 20px; background: transparent; color: #666; border: none; font-size: 18px; text-decoration: underline; }
    </style>
</head>
<body>

    <!-- 主页面内容 -->
    <div class="main-content" id="app-content">
        <div class="main-title">安心提醒</div>
        
        <!-- 药品列表 -->
        <div class="card">
            <h2>💊 我的吃药计划</h2>
            <div id="med-list">
                <!-- 动态渲染药品 -->
            </div>
        </div>

        <!-- 添加药品表单 -->
        <div class="card">
            <h2>➕ 添加新提醒</h2>
            <div class="form-group">
                <label>药品名称</label>
                <input type="text" id="input-name" placeholder="例如：降压药">
            </div>
            <div class="form-group">
                <label>用量 / 次数</label>
                <input type="text" id="input-dose" placeholder="例如：1片 / 每日2次">
            </div>
            <div class="form-group">
                <label>时间</label>
                <input type="time" id="input-time" value="08:00">
            </div>
            <button class="btn-save" onclick="addMedication()">保存提醒</button>
        </div>

        <!-- 八段锦入口 -->
        <div class="card" style="border-left: 6px solid #10b981;">
            <h2>🧘 活动时间</h2>
            <p>久坐伤身，起来做做八段锦，舒展一下筋骨吧。</p>
            <button onclick="startBaduanjin()" style="margin-top: 15px; padding: 15px; font-size: 20px; background: #10b981; color: white; border: none; border-radius: 8px; width: 100%; font-weight: bold;">开始做操</button>
        </div>
    </div>

    <!-- 首屏引导层 -->
    <div id="guide-overlay">
        <div class="guide-icon" id="g-icon">👋</div>
        <div class="guide-title" id="g-title">欢迎使用安心提醒</div>
        <div class="guide-desc" id="g-desc">这是专为老年人设计的吃药与活动提醒小助手。</div>
        <div class="guide-dots" id="g-dots"></div>
        <button class="guide-btn" id="g-btn" onclick="nextGuideStep()">下一步</button>
    </div>

    <!-- 八段锦引导层 -->
    <div id="baduanjin-overlay">
        <h1 class="bdj-title" id="bdj-title">第一式：双手托天理三焦</h1>
        <div class="bdj-icon" id="bdj-icon">🙆‍♂️</div>
        <p class="bdj-desc" id="bdj-desc">动作要点：双手交叉，向上托举，拉伸腰背。慢慢吸气，慢慢呼气。</p>
        <button onclick="nextBaduanjin()" id="bdj-btn" class="bdj-btn">下一个动作</button>
        <button onclick="closeBaduanjin()" class="bdj-close">暂时不做，返回首页</button>
        
        <!-- 背景音乐 -->
        <audio id="bdj-music" src="music/bdj.mp3" loop></audio>
    </div>

    <script src="app.js"></script>
</body>
</html>
