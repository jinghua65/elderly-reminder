name: Build and Release Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# 关键：赋予 Action 创建 Release 的权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22' # Capacitor CLI 需要 22
        
    - name: Install dependencies
      run: npm install
      
    - name: Sync Capacitor
      run: npx cap sync android
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21' # Capacitor 7 需要 21
        distribution: 'temurin'
        
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk

    # ================= 新增的核心部分：自动发布 Release =================
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: android/app/build/outputs/apk/debug/app-debug.apk
        tag_name: v1.0.${{ github.run_number }} # 使用运行次数作为版本号，每次自动递增
        name: 安心提醒 v1.0.${{ github.run_number }}
        body: "这是通过 GitHub Actions 自动构建的最新测试版本。"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
